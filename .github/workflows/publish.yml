name: Publish

on:
  workflow_dispatch:
    inputs:
      promote_latest:
        description: "Move npm latest dist-tags to the package.json versions"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # OIDC — Trusted Publisher + npm provenance

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Promote package versions to npm latest
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote_latest }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN repository secret is required to move npm dist-tags."
            exit 1
          fi

          for PKG_DIR in \
            packages/shared \
            packages/scanner \
            packages/reporter \
            packages/mcp \
            packages/entitlement \
            packages/cli
          do
            PKG_NAME=$(node -p "require('./${PKG_DIR}/package.json').name")
            PKG_VER=$(node -p "require('./${PKG_DIR}/package.json').version")
            npm dist-tag add "${PKG_NAME}@${PKG_VER}" latest
          done

      - name: Install dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.promote_latest }}
        run: pnpm install --frozen-lockfile

      - name: Build
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.promote_latest }}
        run: pnpm build

      - name: Typecheck
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.promote_latest }}
        run: pnpm typecheck

      # ── npm provenance ──────────────────────────────────────────
      # Every `npm publish` call below uses --provenance so npm
      # attests the tarball's origin (repo + commit + workflow run).
      # Verified badges appear on each package page under "Provenance".
      #
      # HARD REQUIREMENT: this repo must stay PUBLIC for provenance.
      # If it's flipped private, publish returns "provenance requires
      # a public repository." Visibility toggle:
      # https://github.com/Top-Notchh-Solutions/verglos-cli/settings.
      #
      # Each publish step is idempotent: if the exact package@version
      # is already on npm, the step logs a notice and exits 0. This
      # protects against re-runs after a tag move / re-push and
      # against partial-failure recovery (e.g. shared already
      # published, scanner still needed).

      - name: Publish shared package
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.promote_latest }}
        run: |
          PKG_DIR=packages/shared
          PKG_NAME=$(node -p "require('./${PKG_DIR}/package.json').name")
          PKG_VER=$(node -p "require('./${PKG_DIR}/package.json').version")
          if npm view "${PKG_NAME}@${PKG_VER}" version >/dev/null 2>&1; then
            echo "::notice::${PKG_NAME}@${PKG_VER} already published — skipping"
            exit 0
          fi
          mkdir -p /tmp/verglos-publish/shared
          pnpm -C "${PKG_DIR}" pack --pack-destination /tmp/verglos-publish/shared
          npm publish /tmp/verglos-publish/shared/*.tgz --access public --provenance --tag alpha

      - name: Publish scanner package
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.promote_latest }}
        run: |
          PKG_DIR=packages/scanner
          PKG_NAME=$(node -p "require('./${PKG_DIR}/package.json').name")
          PKG_VER=$(node -p "require('./${PKG_DIR}/package.json').version")
          if npm view "${PKG_NAME}@${PKG_VER}" version >/dev/null 2>&1; then
            echo "::notice::${PKG_NAME}@${PKG_VER} already published — skipping"
            exit 0
          fi
          mkdir -p /tmp/verglos-publish/scanner
          pnpm -C "${PKG_DIR}" pack --pack-destination /tmp/verglos-publish/scanner
          npm publish /tmp/verglos-publish/scanner/*.tgz --access public --provenance --tag alpha

      - name: Publish reporter package
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.promote_latest }}
        run: |
          PKG_DIR=packages/reporter
          PKG_NAME=$(node -p "require('./${PKG_DIR}/package.json').name")
          PKG_VER=$(node -p "require('./${PKG_DIR}/package.json').version")
          if npm view "${PKG_NAME}@${PKG_VER}" version >/dev/null 2>&1; then
            echo "::notice::${PKG_NAME}@${PKG_VER} already published — skipping"
            exit 0
          fi
          mkdir -p /tmp/verglos-publish/reporter
          pnpm -C "${PKG_DIR}" pack --pack-destination /tmp/verglos-publish/reporter
          npm publish /tmp/verglos-publish/reporter/*.tgz --access public --provenance --tag alpha

      - name: Publish mcp package
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.promote_latest }}
        run: |
          PKG_DIR=packages/mcp
          PKG_NAME=$(node -p "require('./${PKG_DIR}/package.json').name")
          PKG_VER=$(node -p "require('./${PKG_DIR}/package.json').version")
          if npm view "${PKG_NAME}@${PKG_VER}" version >/dev/null 2>&1; then
            echo "::notice::${PKG_NAME}@${PKG_VER} already published — skipping"
            exit 0
          fi
          mkdir -p /tmp/verglos-publish/mcp
          pnpm -C "${PKG_DIR}" pack --pack-destination /tmp/verglos-publish/mcp
          npm publish /tmp/verglos-publish/mcp/*.tgz --access public --provenance --tag alpha

      - name: Publish entitlement package
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.promote_latest }}
        run: |
          PKG_DIR=packages/entitlement
          PKG_NAME=$(node -p "require('./${PKG_DIR}/package.json').name")
          PKG_VER=$(node -p "require('./${PKG_DIR}/package.json').version")
          if npm view "${PKG_NAME}@${PKG_VER}" version >/dev/null 2>&1; then
            echo "::notice::${PKG_NAME}@${PKG_VER} already published — skipping"
            exit 0
          fi
          mkdir -p /tmp/verglos-publish/entitlement
          pnpm -C "${PKG_DIR}" pack --pack-destination /tmp/verglos-publish/entitlement
          npm publish /tmp/verglos-publish/entitlement/*.tgz --access public --provenance --tag alpha

      - name: Publish CLI package
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.promote_latest }}
        run: |
          PKG_DIR=packages/cli
          PKG_NAME=$(node -p "require('./${PKG_DIR}/package.json').name")
          PKG_VER=$(node -p "require('./${PKG_DIR}/package.json').version")
          if npm view "${PKG_NAME}@${PKG_VER}" version >/dev/null 2>&1; then
            echo "::notice::${PKG_NAME}@${PKG_VER} already published — skipping"
            exit 0
          fi
          mkdir -p /tmp/verglos-publish/cli
          pnpm -C "${PKG_DIR}" pack --pack-destination /tmp/verglos-publish/cli
          npm publish /tmp/verglos-publish/cli/*.tgz --access public --provenance --tag alpha
