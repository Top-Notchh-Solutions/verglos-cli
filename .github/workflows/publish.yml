name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # OIDC — Trusted Publisher + npm provenance

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    # The repository's `release` environment must require an explicit
    # reviewer before any registry mutation.
    environment:
      name: release
    concurrency:
      group: verglos-release-publication
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify immutable release tag
        run: node scripts/verify-release-tag.mjs "$GITHUB_REF_NAME"

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Install all platform-specific lock entries for license evidence; this does not declare them as supported product targets.
      - name: Configure cross-platform license evidence
        run: node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.pnpm={...(p.pnpm||{}),supportedArchitectures:{os:["current","aix","android","darwin","freebsd","linux","netbsd","openbsd","openharmony","sunos","win32"],cpu:["current","arm","arm64","ia32","loong64","mips64el","ppc64","riscv64","s390x","x64"]}}; fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n");'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test release artifact verifier
        run: node --test scripts/verify-release-artifacts.test.mjs scripts/generate-third-party-notices.test.mjs scripts/license-inventory.test.mjs scripts/package-surface-audit.test.mjs scripts/external-license-records.test.mjs

      - name: Verify release rollback/revocation rehearsal
        run: node scripts/verify-release-rollback-rehearsal.mjs

      - name: Audit package contents
        run: node scripts/check-package-contents.mjs

      - name: Audit public boundary
        run: node scripts/check-public-boundary.mjs

      - name: Pack smoke test
        run: |
          set -euo pipefail
          AUDIT_DIR=$(mktemp -d)
          trap 'rm -rf "$AUDIT_DIR"' EXIT
          node scripts/pack-public-packages.mjs "$AUDIT_DIR"
          while IFS= read -r archive; do
            if tar -tzf "$archive" | grep -Eiq '(^|/)(docs/shipping|.*\.(pem|key|p12|pfx)|\.env($|\.)|id_rsa|id_ed25519)'; then
              echo "::error::forbidden private/internal path found in $archive"
              exit 1
            fi
          done < <(find "$AUDIT_DIR" -type f -name '*.tgz' -print)
          node scripts/check-packed-manifests.mjs "$AUDIT_DIR"

      - name: Prepare release packages and licensing evidence
        run: |
          set -euo pipefail
          RELEASE_DIR=$(mktemp -d)
          echo "RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"
          node scripts/license-inventory.mjs --require-clear > "$RELEASE_DIR/dependency-license-inventory.json"
          node scripts/pack-public-packages.mjs "$RELEASE_DIR"
          node scripts/generate-third-party-notices.mjs > "$RELEASE_DIR/THIRD_PARTY_NOTICES"
          node scripts/generate-sbom.mjs > "$RELEASE_DIR/SBOM.cdx.json"
          node scripts/generate-spdx.mjs > "$RELEASE_DIR/SBOM.spdx.json"
          node scripts/validate-external-license-records.mjs
          cp licenses/external-content-records.json "$RELEASE_DIR/external-license-records.json"

      - name: Verify clean consumer install
        run: |
          node --test scripts/verify-clean-consumer.test.mjs
          node scripts/verify-clean-consumer.mjs "$RELEASE_DIR" > "$RELEASE_DIR/clean-consumer-verification.txt"

      - name: Prepare release checksums
        run: |
          set -euo pipefail
          cd "$RELEASE_DIR"
          sha256sum ./*.tgz ./THIRD_PARTY_NOTICES ./SBOM.cdx.json ./SBOM.spdx.json ./dependency-license-inventory.json ./external-license-records.json ./clean-consumer-verification.txt > SHA256SUMS

      - name: Verify release checksums
        run: node scripts/verify-release-artifacts.mjs "$RELEASE_DIR" --require-seven

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verglos-npm-artifacts-${{ github.sha }}
          path: |
            ${{ env.RELEASE_DIR }}/*.tgz
            ${{ env.RELEASE_DIR }}/SHA256SUMS
            ${{ env.RELEASE_DIR }}/THIRD_PARTY_NOTICES
            ${{ env.RELEASE_DIR }}/SBOM.cdx.json
            ${{ env.RELEASE_DIR }}/SBOM.spdx.json
            ${{ env.RELEASE_DIR }}/external-license-records.json
            ${{ env.RELEASE_DIR }}/clean-consumer-verification.txt
            ${{ env.RELEASE_DIR }}/dependency-license-inventory.json
          if-no-files-found: error
          retention-days: 14

      # ── npm provenance ──────────────────────────────────────────
      # Every `npm publish` call below uses --provenance so npm
      # attests the tarball's origin (repo + commit + workflow run).
      # Verified badges appear on each package page under "Provenance".
      #
      # HARD REQUIREMENT: this repo must stay PUBLIC for provenance.
      # If it's flipped private, publish returns "provenance requires
      # a public repository." Visibility toggle:
      # https://github.com/Top-Notchh-Solutions/verglos-cli/settings.
      #
      # Each publish step is idempotent: if the exact package@version
      # is already on npm, the step logs a notice and exits 0. This
      # protects against re-runs after a tag move / re-push and
      # against partial-failure recovery (e.g. shared already
      # published, scanner still needed).

      - name: Publish shared package
        run: |
          PKG_DIR=packages/shared
          PKG_NAME=$(node -p "require('./${PKG_DIR}/package.json').name")
          PKG_VER=$(node -p "require('./${PKG_DIR}/package.json').version")
          if npm view "${PKG_NAME}@${PKG_VER}" version >/dev/null 2>&1; then
            echo "::notice::${PKG_NAME}@${PKG_VER} already published — skipping"
            exit 0
          fi
          npm publish "${RELEASE_DIR}/verglos-shared-${PKG_VER}.tgz" --access public --provenance --tag alpha

      - name: Publish scanner package
        run: |
          PKG_DIR=packages/scanner
          PKG_NAME=$(node -p "require('./${PKG_DIR}/package.json').name")
          PKG_VER=$(node -p "require('./${PKG_DIR}/package.json').version")
          if npm view "${PKG_NAME}@${PKG_VER}" version >/dev/null 2>&1; then
            echo "::notice::${PKG_NAME}@${PKG_VER} already published — skipping"
            exit 0
          fi
          npm publish "${RELEASE_DIR}/verglos-scanner-${PKG_VER}.tgz" --access public --provenance --tag alpha

      - name: Publish reporter package
        run: |
          PKG_DIR=packages/reporter
          PKG_NAME=$(node -p "require('./${PKG_DIR}/package.json').name")
          PKG_VER=$(node -p "require('./${PKG_DIR}/package.json').version")
          if npm view "${PKG_NAME}@${PKG_VER}" version >/dev/null 2>&1; then
            echo "::notice::${PKG_NAME}@${PKG_VER} already published — skipping"
            exit 0
          fi
          npm publish "${RELEASE_DIR}/verglos-reporter-${PKG_VER}.tgz" --access public --provenance --tag alpha

      - name: Publish mcp package
        run: |
          PKG_DIR=packages/mcp
          PKG_NAME=$(node -p "require('./${PKG_DIR}/package.json').name")
          PKG_VER=$(node -p "require('./${PKG_DIR}/package.json').version")
          if npm view "${PKG_NAME}@${PKG_VER}" version >/dev/null 2>&1; then
            echo "::notice::${PKG_NAME}@${PKG_VER} already published — skipping"
            exit 0
          fi
          npm publish "${RELEASE_DIR}/verglos-mcp-${PKG_VER}.tgz" --access public --provenance --tag alpha

      - name: Publish entitlement package
        run: |
          PKG_DIR=packages/entitlement
          PKG_NAME=$(node -p "require('./${PKG_DIR}/package.json').name")
          PKG_VER=$(node -p "require('./${PKG_DIR}/package.json').version")
          if npm view "${PKG_NAME}@${PKG_VER}" version >/dev/null 2>&1; then
            echo "::notice::${PKG_NAME}@${PKG_VER} already published — skipping"
            exit 0
          fi
          npm publish "${RELEASE_DIR}/verglos-entitlement-${PKG_VER}.tgz" --access public --provenance --tag alpha

      - name: Publish Hunt package
        run: |
          PKG_DIR=packages/hunt
          PKG_NAME=$(node -p "require('./${PKG_DIR}/package.json').name")
          PKG_VER=$(node -p "require('./${PKG_DIR}/package.json').version")
          if npm view "${PKG_NAME}@${PKG_VER}" version >/dev/null 2>&1; then
            echo "::notice::${PKG_NAME}@${PKG_VER} already published — skipping"
            exit 0
          fi
          npm publish "${RELEASE_DIR}/verglos-hunt-${PKG_VER}.tgz" --access public --provenance --tag alpha

      - name: Publish CLI package
        run: |
          PKG_DIR=packages/cli
          PKG_NAME=$(node -p "require('./${PKG_DIR}/package.json').name")
          PKG_VER=$(node -p "require('./${PKG_DIR}/package.json').version")
          if npm view "${PKG_NAME}@${PKG_VER}" version >/dev/null 2>&1; then
            echo "::notice::${PKG_NAME}@${PKG_VER} already published — skipping"
            exit 0
          fi
          npm publish "${RELEASE_DIR}/verglos-${PKG_VER}.tgz" --access public --provenance --tag alpha
