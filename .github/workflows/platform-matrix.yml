name: Platform matrix

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # The release notice/SBOM generators account for every supported
      # optional platform package, not only the runner's current platform.
      # Materialize those lockfile entries before the matrix install so the
      # clean-consumer qualification sees the same complete dependency graph
      # on Ubuntu, macOS, and Windows.
      - name: Configure cross-platform license evidence
        shell: bash
        run: node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.pnpm={...(p.pnpm||{}),supportedArchitectures:{os:["current","aix","android","darwin","freebsd","linux","netbsd","openbsd","openharmony","sunos","win32"],cpu:["current","arm","arm64","ia32","loong64","mips64el","ppc64","riscv64","s390x","x64"]}}; fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n");'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Qualify clean public package consumer
        shell: bash
        run: |
          node scripts/pack-public-packages.mjs .artifacts/public-packages
          node scripts/check-packed-manifests.mjs .artifacts/public-packages
          node scripts/verify-clean-consumer.mjs .artifacts/public-packages | tee clean-consumer-${{ matrix.os }}-node-${{ matrix.node }}.log

      - name: Upload clean consumer evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: clean-consumer-${{ matrix.os }}-node-${{ matrix.node }}-${{ github.sha }}
          path: clean-consumer-${{ matrix.os }}-node-${{ matrix.node }}.log
          if-no-files-found: error
          retention-days: 14

      - name: Qualify upgrade and rollback transition
        shell: bash
        run: node scripts/verify-upgrade-rollback.mjs .artifacts/public-packages | tee upgrade-rollback-${{ matrix.os }}-node-${{ matrix.node }}.log

      - name: Upload upgrade and rollback evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-rollback-${{ matrix.os }}-node-${{ matrix.node }}-${{ github.sha }}
          path: upgrade-rollback-${{ matrix.os }}-node-${{ matrix.node }}.log
          if-no-files-found: error
          retention-days: 14

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  in-toto-release-binding:
    name: in-toto release binding
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure cross-platform license evidence
        shell: bash
        run: node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.pnpm={...(p.pnpm||{}),supportedArchitectures:{os:["current","aix","android","darwin","freebsd","linux","netbsd","openbsd","openharmony","sunos","win32"],cpu:["current","arm","arm64","ia32","loong64","mips64el","ppc64","riscv64","s390x","x64"]}}; fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n");'

      - name: Install official in-toto verifier
        run: python -m pip install --disable-pip-version-check --no-warn-script-location in-toto==3.0.0

      - name: Build and bind public release archives
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
          node scripts/pack-public-packages.mjs .artifacts/public-packages
          python scripts/verify-in-toto-release.py .artifacts/public-packages | tee in-toto-release-binding.log

      - name: Upload in-toto release evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: in-toto-release-binding-${{ github.sha }}
          path: in-toto-release-binding.log
          if-no-files-found: error
          retention-days: 14
