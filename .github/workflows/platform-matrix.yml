name: Platform matrix

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Qualify clean public package consumer
        shell: bash
        run: |
          node scripts/pack-public-packages.mjs .artifacts/public-packages
          node scripts/check-packed-manifests.mjs .artifacts/public-packages
          node scripts/verify-clean-consumer.mjs .artifacts/public-packages | tee clean-consumer-${{ matrix.os }}-node-${{ matrix.node }}.log

      - name: Upload clean consumer evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: clean-consumer-${{ matrix.os }}-node-${{ matrix.node }}-${{ github.sha }}
          path: clean-consumer-${{ matrix.os }}-node-${{ matrix.node }}.log
          if-no-files-found: error
          retention-days: 14

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
