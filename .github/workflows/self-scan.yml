name: Self-scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# This job runs the current Verglos code against the Verglos repo
# itself and fails the PR when the score drops below 95.

permissions:
  contents: read

concurrency:
  group: self-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Verglos scans Verglos
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need full git history for D8-002 secret-in-history + provenance signals

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dependency license inventory
        run: node scripts/license-inventory.mjs --check > dependency-license-inventory.json

      - name: Check third-party notices drift
        run: |
          node scripts/generate-third-party-notices.mjs > generated-third-party-notices
          test -s generated-third-party-notices
          grep -q '^THIRD-PARTY NOTICES$' generated-third-party-notices

      - name: Check CycloneDX SBOM drift
        run: |
          node scripts/generate-sbom.mjs > generated-sbom.json
          node -e 'const x=require("./generated-sbom.json"); if(x.bomFormat!=="CycloneDX" || !Array.isArray(x.components) || x.components.length===0) process.exit(1)'

      - name: Check SPDX SBOM drift
        run: |
          node scripts/generate-spdx.mjs > generated-spdx.json
          node -e 'const x=require("./generated-spdx.json"); if(x.spdxVersion!=="SPDX-2.3" || !Array.isArray(x.packages) || x.packages.length===0) process.exit(1)'

      - name: Upload license and SBOM evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-license-evidence-${{ github.sha }}
          path: |
            dependency-license-inventory.json
            generated-third-party-notices
            generated-sbom.json
            generated-spdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Build
        run: pnpm build

      - name: Qualify clean public package archives
        run: |
          node --test scripts/pack-public-packages.test.mjs
          node scripts/pack-public-packages.mjs .artifacts/public-packages
          node scripts/check-packed-manifests.mjs .artifacts/public-packages

      - name: Verify clean consumer install
        run: |
          set -o pipefail
          node --test scripts/verify-clean-consumer.test.mjs
          node scripts/verify-clean-consumer.mjs .artifacts/public-packages | tee .artifacts/public-packages/clean-consumer-verification.txt

      - name: Upload public package evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: public-package-archives-${{ github.sha }}
          path: |
            .artifacts/public-packages/*.tgz
            .artifacts/public-packages/clean-consumer-verification.txt
          if-no-files-found: error
          retention-days: 14

      - name: Test
        run: pnpm test

      - name: Run pinned Hunt Docker adversarial suite
        env:
          VERGLOS_HUNT_DOCKER_INTEGRATION: "1"
          VERGLOS_HUNT_TEST_IMAGE: postgres:15-alpine
          VERGLOS_HUNT_TEST_DIGEST: sha256:2bf082886c059b4cf5af3f9e8d3a8916c35699062899061c13bc32d5921c631a
        run: |
          set -o pipefail
          pnpm --filter @verglos/hunt test 2>&1 | tee hunt-docker-adversarial.log

      - name: Upload Hunt adversarial evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: hunt-docker-adversarial-${{ github.sha }}
          path: hunt-docker-adversarial.log
          if-no-files-found: error
          retention-days: 14

      - name: Test release artifact verifier
        run: node --test scripts/verify-release-artifacts.test.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Audit package contents
        run: node scripts/check-package-contents.mjs

      - name: Audit public boundary
        run: node scripts/check-public-boundary.mjs

      - name: Run Verglos on itself
        # The CI command exits non-zero on any critical finding OR when
        # the score falls below --threshold.
        #
        # We deliberately do NOT pass --strict here. --strict is a
        # per-user opt-in that re-promotes test-file findings to their
        # original severity — useful when a user is scanning their own
        # app and wants tests included in the score. For Verglos-scans-
        # Verglos it doesn't work: our own test files (context.test.ts,
        # secrets.test.ts) contain hand-written vuln-shaped strings as
        # classifier test inputs. Under --strict those score as real
        # criticals and permanently fail CI.
        #
        # Deliberately-vulnerable inputs under packages/scanner/fixtures/**
        # are also excluded via .verglos.config.js.
        run: node packages/cli/dist/index.js ci --threshold 95
